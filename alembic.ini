# Alembic configuration.
#
# NOTE: `sqlalchemy.url` is intentionally left empty here.
# The real connection string is resolved by alembic/env.py in this order:
#   1. environment variable RAG_DATABASE_URL  (production / CI always uses this)
#   2. sqlalchemy.url in this file            (injected by tests via set_main_option)
#   3. services.ingestion.db.DEFAULT_DATABASE_URL  (local SQLite fallback)
# No database credential is ever hardcoded in source code.
#
# This file must stay ASCII-only: alembic reads it with the OS locale encoding,
# and non-ASCII bytes break the read on zh-CN Windows (GBK).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Migration file names carry a numeric prefix so they run in ascending order.
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
